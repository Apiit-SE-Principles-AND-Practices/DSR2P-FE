name: Release

# On every push to main, release-please keeps a "release PR" up to date (version bump + CHANGELOG).
# Merging that PR creates the tag and GitHub Release; the artifact job then attaches the build to it.
# Both live in one workflow because tags made with the default token do not start other workflows.

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please labels its PRs
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # A personal token lets the release PR start the CI checks; the default token cannot.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifact:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to attach files to the release
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Never ship a build that does not pass; the production build also enforces the size budgets.
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build
      - name: Package
        run: |
          cd dist/dsr2p-fe/browser
          zip -r "$GITHUB_WORKSPACE/dsr2p-fe-$TAG.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum "dsr2p-fe-$TAG.zip" > "dsr2p-fe-$TAG.zip.sha256"
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "dsr2p-fe-$TAG.zip" "dsr2p-fe-$TAG.zip.sha256" --clobber
