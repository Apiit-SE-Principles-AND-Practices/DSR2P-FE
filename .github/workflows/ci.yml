name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      # Unit tests include the WCAG contrast gate (core/contrast.spec.ts).
      - run: npm run test:ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
